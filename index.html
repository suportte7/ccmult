<!DOCTYPE html>
<html lang="pt-BR" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ControlCard">
  <meta name="theme-color" content="#c084fc">
  <title>ControlCardMult</title>
  <link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23c084fc' rx='20'/%3E%3Ctext x='50' y='65' font-size='45' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3ECC%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-titulo" id="modalTitulo"></div>
    <div id="modalBody"></div>
    <div class="modal-acoes" id="modalAcoes"></div>
  </div>
</div>

<!-- ==================== TELA LOGIN ==================== -->
<div class="tela ativa" id="telaLogin">
  <div class="login-wrap">
    <div class="login-logo">CC</div>
    <div class="login-titulo">ControlCard</div>
    <div class="login-sub">Gestão de cartões e acordos</div>
    <div class="login-box">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>PIN</label>
        <input type="password" id="loginPin" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="current-password">
      </div>
      <button class="btn-primary" id="btnLogin">Entrar</button>
      <div class="login-footer">
        <button class="btn-link" id="btnShowReg">Criar conta</button> ·
        <button class="btn-link" id="btnEsqueceuPin">Esqueci o PIN</button>
      </div>
    </div>
  </div>
</div>

<!-- ==================== TELA REGISTRO ==================== -->
<div class="tela" id="telaRegistro">
  <div class="login-wrap">
    <div class="login-logo">CC</div>
    <div class="login-titulo">Criar Conta</div>
    <div class="login-sub">Preencha seus dados</div>
    <div class="login-box">
      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="regNome" placeholder="Seu nome">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>PIN (4 dígitos)</label>
        <input type="password" id="regPin" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="new-password">
      </div>
      <button class="btn-primary" id="btnRegistrar">Criar Conta</button>
      <div class="login-footer">
        <button class="btn-link" id="btnShowLogin">Já tenho conta</button>
      </div>
    </div>
  </div>
</div>

<!-- ==================== TELA RESET PIN ==================== -->
<div class="tela" id="telaReset">
  <div class="login-wrap">
    <div class="login-logo">CC</div>
    <div class="login-titulo">Redefinir PIN</div>
    <div class="login-sub">Enviaremos um token por email</div>
    <div class="login-box" id="resetStep1">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="resetEmail" placeholder="seu@email.com">
      </div>
      <button class="btn-primary" id="btnEnviarToken">Enviar Token</button>
      <div class="login-footer">
        <button class="btn-link" id="btnVoltarLogin">Voltar</button>
      </div>
    </div>
    <div class="login-box" id="resetStep2" style="display:none">
      <div class="form-group">
        <label>Token recebido por email</label>
        <input type="text" id="resetToken" placeholder="Ex: AB12CD34" style="text-transform:uppercase">
      </div>
      <div class="form-group">
        <label>Novo PIN</label>
        <input type="password" id="resetNovoPin" maxlength="4" inputmode="numeric" placeholder="••••">
      </div>
      <button class="btn-primary" id="btnConfirmarReset">Confirmar Novo PIN</button>
    </div>
  </div>
</div>

<!-- ==================== TELA APP ==================== -->
<div class="tela" id="telaApp">
  <div class="app-wrap">
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-mark">CC</div>
        <span class="brand-name">ControlCard</span>
      </div>
      <div class="header-acoes">
        <div class="icon-btn" id="btnSync" title="Sincronizar">
          <span class="material-icons-outlined">sync</span>
        </div>
        <div class="icon-btn" id="btnTema" title="Tema">
          <span class="material-icons-outlined">palette</span>
        </div>
        <div class="icon-btn" id="btnLogout" title="Sair">
          <span class="material-icons-outlined">logout</span>
        </div>
      </div>
    </header>

    <main class="app-content" id="appContent"></main>

    <nav class="dock-wrapper">
      <div class="dock">
        <button class="dock-btn ativo" data-tela="dashboard">
          <span class="material-icons-outlined">dashboard</span>
          Dashboard
        </button>
        <button class="dock-btn" data-tela="cartoes">
          <span class="material-icons-outlined">credit_card</span>
          Cartões
        </button>
        <button class="dock-btn" data-tela="pessoas">
          <span class="material-icons-outlined">group</span>
          Pessoas
        </button>
        <button class="dock-btn" data-tela="gastos">
          <span class="material-icons-outlined">receipt_long</span>
          Gastos
        </button>
        <button class="dock-btn" data-tela="acordos">
          <span class="material-icons-outlined">handshake</span>
          Acordos
        </button>
        <button class="dock-btn" data-tela="mais">
          <span class="material-icons-outlined">more_horiz</span>
          Mais
        </button>
      </div>
    </nav>
  </div>
</div>

<!-- SCRIPTS -->
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dados.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/cartoes.js"></script>
<script src="js/pessoas.js"></script>
<script src="js/gastos.js"></script>
<script src="js/acordos.js"></script>
<script src="js/mais.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
